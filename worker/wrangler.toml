# Сервер покупок «Острова слов» (Cloudflare Workers, бесплатный тариф).
name = "ostrov-slov-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# KV-хранилище покупок. id появится после: npx wrangler kv namespace create DB
[[kv_namespaces]]
binding = "DB"
id = "082c08dc11304f8eb0719317eaec6464"

account_id = "b2a149cb46f0d882a630afaab0eacbe6"

[vars]
# Адрес мини-приложения на Cloudflare Pages
APP_URL = "https://ostrov-slov.pages.dev"
# Контакт для /paysupport и /terms (например "@твой_ник")
# Telegram id админов через запятую (админка в приложении)
ADMIN_IDS = ""
SUPPORT_CONTACT = "@finderdsfg3bot"

# Секреты задаются командами (в файл их не писать!):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
